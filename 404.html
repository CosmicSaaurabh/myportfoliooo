<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var t=localStorage.getItem('ide.theme.v1');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'github-light':'monokai';document.documentElement.setAttribute('data-theme',t);})();</script>
<title>404 — Saurabh Mishra</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<style>
  .nf{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:24px; text-align:center; background:var(--bg); color:var(--fg);
  }
  .nf pre{
    font-family:var(--font-mono); font-size:13px; line-height:1.7; color:var(--fg-dim);
    text-align:left; margin:0; padding:18px 22px; border:1px solid var(--border);
    border-radius:var(--radius); background:var(--bg-2); max-width:100%; overflow-x:auto;
  }
  .nf .code-line{color:var(--pink)}
  .nf h1{font-family:var(--font-mono); font-size:clamp(38px,10vw,64px); margin:0; color:var(--orange)}
  .nf p{font-family:var(--font-sans); font-size:15px; color:var(--fg-dim); margin:0; max-width:46ch; line-height:1.6}
</style>
</head>
<body>
<main class="nf">
  <h1>404</h1>
  <p>That path is not in the tree. Everything on this site is reachable from the explorer.</p>
<pre><span class="code-line">$ cat <span id="what">that-file</span></span>
cat: no such file or directory

<span class="code-line">$ ls</span>
README.md   about.md   experience/   projects/
skills.json   profiles.md   interview.md   contact.sh</pre>
  <a class="cta cta-primary" href="./">Back to the portfolio →</a>
</main>
<script>
  // Show what was actually asked for, escaped — never inject the raw path.
  var p = location.pathname.split('/').filter(Boolean).pop() || 'that-file';
  document.getElementById('what').textContent = p.slice(0, 60);
</script>
</body>
</html>
